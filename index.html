<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PWA Test</title>

  <!-- ✅ IKONY – OBOWIĄZKOWE -->
  <link rel="icon" href="icon-512-maskable.png">
  <link rel="apple-touch-icon" href="icon-512-maskable.png">

  <!-- ✅ MANIFEST -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#1976d2">
</head>

<body>

<h1>PWA działa ✅</h1>
<p>Test instalacji PWA – GitHub Pages</p>

<button id="installBtn" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 14px 20px;
  font-size: 16px;
  display: none;
">
Zainstaluj aplikację
</button>

<pre id="log" style="margin-top:40px; font-size:12px;"></pre>

<script>
function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
  console.log(msg);
}

// ✅ SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(reg => {
      log('✅ Service Worker OK');
      log('scope: ' + reg.scope);
    })
    .catch(err => log('❌ SW error: ' + err));
}

// ✅ INSTALL PROMPT
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  log('✅ beforeinstallprompt');
  document.getElementById('installBtn').style.display = 'block';
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const res = await deferredPrompt.userChoice;
  log('📦 Instalacja: ' + res.outcome);
  deferredPrompt = null;
});

// ✅ DIAGNOSTYKA
window.addEventListener('load', () => {
  log('Standalone: ' + window.matchMedia('(display-mode: standalone)').matches);
  log('UA: ' + navigator.userAgent);
});
</script>

</body>
</html>
